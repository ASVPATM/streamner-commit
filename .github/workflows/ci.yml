name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_OFFLINE: "1"
  MLX_ENABLE_TF32: "0"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  fast-checks:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python environment
        run: |
          test "$(uname -m)" = "arm64"
          uv python install 3.12
          uv sync --locked --dev

      - name: Run fast tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src scripts
