[project]
name = "streamner-commit"
version = "0.1.0"
description = "Commitment policies for streaming entity predictions, with a native MLX runtime"
readme = "README.md"
authors = [
    { name = "ASVPATM" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
    "transformers==5.12.1",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "datasets",
    "huggingface-hub",
    "safetensors",
    "tokenizers",
    "pyyaml",
    "matplotlib",
    "pyarrow",
    "typer",
    "rich",
]

[project.scripts]
streamner-commit = "streamner_commit:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
